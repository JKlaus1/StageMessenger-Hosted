<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/pwa/control-192.png">
  <title>Admin — Stage Messenger</title>
  <link rel="stylesheet" href="/sm.css">
  <script src="/sm-ui.js"></script>
  <style>
    .item { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; padding: .8rem 0; border-bottom: 1px solid var(--border); }
    .item:last-child { border-bottom: 0; padding-bottom: 0; }
    .item:first-child { padding-top: 0; }
    .item-main { min-width: 0; }
    .item-title { font-weight: 900; font-size: .95rem; word-break: break-word; }
    .item-sub { font-size: .7rem; color: var(--muted); font-weight: 700; letter-spacing: .04em; margin-top: .2rem; line-height: 1.5; }
    .item-acts { display: flex; flex-wrap: wrap; gap: .35rem; justify-content: flex-end; flex-shrink: 0; max-width: 55%; }
    .tag-off { color: #ff6677; }
    .pw-row { display: flex; gap: .5rem; }
    .pw-row input { flex: 1; }
  </style>
</head>
<body class="wide">
  <div class="top">
    <div class="brand">🎸 Admin</div>
    <div class="who hidden" id="who-box">
      <button class="btn small" id="refresh-btn">Refresh</button>
      <button class="btn small" id="out-btn">Sign out</button>
    </div>
  </div>

  <!-- Sign in -->
  <form class="card hidden" id="login" autocomplete="on">
    <div class="field"><label for="apw">Admin password</label>
      <input type="password" id="apw" autocomplete="current-password"></div>
    <div class="err" id="login-err"></div>
    <button class="btn primary block" type="submit">Sign in</button>
  </form>

  <div id="main" class="hidden">
    <div class="label" style="margin-top:0">New leader</div>
    <form class="card" id="new-leader" autocomplete="off">
      <div class="row">
        <div class="field"><label for="nl-user">Username</label>
          <input type="text" id="nl-user" maxlength="32" autocapitalize="none" spellcheck="false" placeholder="e.g. mike"></div>
        <div class="field"><label for="nl-name">Display name</label>
          <input type="text" id="nl-name" maxlength="40" placeholder="e.g. Mike — RDB"></div>
      </div>
      <div class="field"><label for="nl-pw">Password</label>
        <div class="pw-row">
          <input type="text" id="nl-pw" maxlength="256" autocomplete="new-password" spellcheck="false">
          <button class="btn" type="button" id="nl-gen">Generate</button>
        </div>
      </div>
      <div class="field" style="max-width:10rem"><label for="nl-max">Max active gigs</label>
        <input type="number" id="nl-max" min="1" max="50" value="5"></div>
      <div class="err" id="nl-err"></div>
      <button class="btn primary block" type="submit">Create leader</button>
      <div class="note" style="margin-top:.6rem">Send the leader their username, password and the sign-in page
        (<span class="mono" id="login-url"></span>). They can change the password after signing in.</div>
    </form>

    <div class="label">Leaders</div>
    <div class="card" id="leaders"></div>

    <div class="label">Active gigs</div>
    <div class="card" id="gigs"></div>
  </div>

  <script>
    const E = SMUI.el;
    document.getElementById('login-url').textContent = location.origin + '/login';

    function show(signedIn) {
      document.getElementById('login').classList.toggle('hidden', signedIn);
      document.getElementById('main').classList.toggle('hidden', !signedIn);
      document.getElementById('who-box').classList.toggle('hidden', !signedIn);
      if (!signedIn) setTimeout(() => document.getElementById('apw').focus(), 30);
    }

    function btn(label, onClick, cls) {
      return E('button', { class: 'btn small' + (cls ? ' ' + cls : ''), type: 'button', onclick: onClick }, label);
    }

    async function post(path, body, okMsg) {
      const r = await SMUI.api(path, body);
      if (r.status === 401) { show(false); return null; }
      if (!r.ok) { SMUI.toast(r.error, true); return null; }
      if (okMsg) SMUI.toast(okMsg);
      return r;
    }

    function renderLeaders(leaders) {
      const box = document.getElementById('leaders');
      box.innerHTML = '';
      if (!leaders.length) { box.appendChild(E('div', { class: 'note' }, 'No leaders yet — create one above.')); return; }
      leaders.forEach(l => {
        const it = E('div', { class: 'item' });
        const main = E('div', { class: 'item-main' });
        const t = E('div', { class: 'item-title' }, l.username);
        if (!l.active) { t.appendChild(document.createTextNode('  ')); t.appendChild(E('span', { class: 'tag-off' }, 'DISABLED')); }
        main.appendChild(t);
        main.appendChild(E('div', { class: 'item-sub' },
          l.display_name + '  ·  gigs ' + l.active_gigs + '/' + l.max_gigs + '  ·  last sign-in ' + SMUI.ago(l.last_login)));
        const acts = E('div', { class: 'item-acts' });
        acts.appendChild(btn('Reset password', async () => {
          const pw = await SMUI.prompt('New password for ' + l.username,
            'Their other sessions are signed out. Send them the new password.', SMUI.randomPassword(), 'text', 'Set password');
          if (pw == null) return;
          if (await post('/admin/api/leaders/' + l.id, { password: pw })) {
            const creds = 'Stage Messenger leader sign-in\n' + location.origin + '/login\nUsername: ' + l.username + '\nPassword: ' + pw;
            SMUI.alert('Password reset', creds, creds);
            load();
          }
        }));
        acts.appendChild(btn('Max gigs', async () => {
          const v = await SMUI.prompt('Max active gigs for ' + l.username, '1–50', String(l.max_gigs), 'number', 'Save');
          if (v == null) return;
          if (await post('/admin/api/leaders/' + l.id, { max_gigs: parseInt(v, 10) }, 'Saved')) load();
        }));
        acts.appendChild(btn(l.active ? 'Disable' : 'Enable', async () => {
          if (l.active) {
            const ok = await SMUI.confirm('Disable ' + l.username + '?',
              'They are signed out everywhere and can’t sign in. Their running gigs keep going until ended.', 'Disable', true);
            if (!ok) return;
          }
          if (await post('/admin/api/leaders/' + l.id, { active: !l.active }, l.active ? 'Disabled' : 'Enabled')) load();
        }, l.active ? 'danger' : ''));
        it.appendChild(main); it.appendChild(acts);
        box.appendChild(it);
      });
    }

    function renderGigs(gigs) {
      const box = document.getElementById('gigs');
      box.innerHTML = '';
      if (!gigs.length) { box.appendChild(E('div', { class: 'note' }, 'No active gigs.')); return; }
      gigs.forEach(g => {
        const it = E('div', { class: 'item' });
        const main = E('div', { class: 'item-main' });
        main.appendChild(E('div', { class: 'item-title' }, g.name));
        main.appendChild(E('div', { class: 'item-sub' },
          (g.date ? g.date + '  ·  ' : '') + 'leader ' + g.leader + '  ·  ' + g.devices + ' device' + (g.devices === 1 ? '' : 's') +
          '  ·  active ' + SMUI.ago(g.last_activity)));
        const acts = E('div', { class: 'item-acts' });
        acts.appendChild(btn('End gig', async () => {
          const ok = await SMUI.confirm('End “' + g.name + '”?', 'Disconnects every device and kills the link.', 'End gig', true);
          if (ok && await post('/admin/api/gigs/' + encodeURIComponent(g.id) + '/end', {}, 'Gig ended')) load();
        }, 'danger'));
        it.appendChild(main); it.appendChild(acts);
        box.appendChild(it);
      });
    }

    async function load() {
      const r = await SMUI.api('/admin/api/state');
      if (r.status === 401) { show(false); return; }
      if (!r.ok) { SMUI.toast(r.error, true); return; }
      show(true);
      renderLeaders(r.data.leaders);
      renderGigs(r.data.gigs);
    }

    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('login-err');
      err.textContent = '';
      const r = await SMUI.api('/admin/api/login', { password: document.getElementById('apw').value });
      if (!r.ok) { err.textContent = r.error; return; }
      document.getElementById('apw').value = '';
      load();
    });

    document.getElementById('nl-gen').addEventListener('click', () => {
      document.getElementById('nl-pw').value = SMUI.randomPassword();
    });

    document.getElementById('new-leader').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('nl-err');
      err.textContent = '';
      const body = {
        username: document.getElementById('nl-user').value.trim(),
        display_name: document.getElementById('nl-name').value.trim(),
        password: document.getElementById('nl-pw').value,
        max_gigs: parseInt(document.getElementById('nl-max').value, 10) || 5,
      };
      const r = await SMUI.api('/admin/api/leaders', body);
      if (r.status === 401) { show(false); return; }
      if (!r.ok) { err.textContent = r.error; return; }
      const creds = 'Stage Messenger leader sign-in\n' + location.origin + '/login\nUsername: ' + body.username + '\nPassword: ' + body.password;
      SMUI.alert('Leader created', creds + '\n\nCopy this now — the password isn’t shown again.', creds);
      ['nl-user', 'nl-name', 'nl-pw'].forEach(id => { document.getElementById(id).value = ''; });
      document.getElementById('nl-max').value = '5';
      load();
    });

    document.getElementById('refresh-btn').addEventListener('click', load);
    document.getElementById('out-btn').addEventListener('click', async () => {
      await SMUI.api('/admin/api/logout', {});
      show(false);
    });

    load();
  </script>
</body>
</html>
